
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tri ân thầy cô - 20/11</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #fff8dc);
    text-align: center;
    color: #b51e42;
    overflow-x: hidden;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1 {
    color: #d4145a;
    font-size: 35px;
    text-shadow: 2px 2px 5px #ffc0cb;
}

.subtitle {
    font-size: 20px;
    color: #a52a2a;
    font-style: italic;
}

.poster {
    width: 100%;
    border-radius: 18px;
    box-shadow: 0 5px 25px #e9a0b5;
    margin: 20px 0;
}

button {
    background: linear-gradient(45deg, #ff4081, #ff9800);
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
    box-shadow: 0 4px 10px #e7a0b5;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
}

.message {
    background: white;
    padding: 25px;
    border-radius: 20px;
    margin: 20px auto;
    box-shadow: 0 5px 20px #f5b7c8;
    min-height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    line-height: 1.6;
    color: #d4145a;
}

footer {
    margin: 30px 0;
    color: #9c3150;
    font-size: 16px;
}

.heart {
    position: fixed;
    bottom: -30px;
    animation: fly 5s linear forwards;
    pointer-events: none;
    z-index: 10;
}

@keyframes fly {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🌻 CHÚC MỪNG NGÀY 20/11 🌻</h1>

    <p class="subtitle">
        Tri ân những người lái đò thầm lặng!
    </p>

    <!-- Hình ảnh thiệp 20/11 -->
    <img src="thiep-20-11.jpg"
         class="poster"
         alt="Thiệp chúc mừng ngày Nhà giáo Việt Nam">

    <h2>💐 Những lời chúc yêu thương 💐</h2>

    <div class="message" id="message">
        Nhân ngày Nhà giáo Việt Nam 20/11,
        kính chúc thầy cô luôn mạnh khỏe,
        hạnh phúc và thành công!
    </div>

    <button onclick="newWish()">
        💖 Nhận lời chúc mới
    </button>

    <button onclick="copyWish()">
        📋 Sao chép lời chúc
    </button>

    <footer>
        ❤️ Tập thể lớp 7/1 kính tặng thầy cô ❤️
        <br><br>
        Chúc thầy cô ngày 20/11 thật nhiều niềm vui!
    </footer>

</div>

<script>

const wishes = [
    "🌹 Kính chúc thầy cô luôn mạnh khỏe, hạnh phúc và thành công trong sự nghiệp trồng người!",

    "💐 Nhân ngày 20/11, chúng em xin gửi đến thầy cô những lời tri ân chân thành nhất. Cảm ơn thầy cô đã luôn tận tâm dạy dỗ chúng em!",

    "❤️ Chúc thầy cô luôn vui vẻ, tràn đầy nhiệt huyết và mãi là người truyền cảm hứng cho bao thế hệ học trò!",

    "🌻 Cảm ơn thầy cô đã dìu dắt chúng em trên con đường tri thức. Chúng em sẽ luôn ghi nhớ công ơn của thầy cô!",

    "🌷 Kính chúc thầy cô có một ngày Nhà giáo Việt Nam thật ý nghĩa, ngập tràn hoa tươi, tiếng cười và tình yêu thương!",

    "💖 Người lái đò thầm lặng đã đưa chúng em đến bến bờ tri thức. Chúng em xin gửi ngàn lời yêu thương và biết ơn!",

    "🎉 Chúc thầy cô luôn trẻ trung, yêu đời, thành công và mãi giữ ngọn lửa đam mê với nghề giáo!"
];

function newWish() {
    const random = Math.floor(Math.random() * wishes.length);

    document.getElementById("message").innerText =
        wishes[random];

    createHearts();
}

function copyWish() {
    const text =
        document.getElementById("message").innerText;

    navigator.clipboard.writeText(text)
        .then(() => alert("Đã sao chép lời chúc thành công!"))
        .catch(() => alert("Bạn hãy chọn và sao chép lời chúc nhé!"));
}

function createHearts() {
    for (let i = 0; i < 12; i++) {
        const heart = document.createElement("div");

        heart.className = "heart";
        heart.innerHTML = ["❤️", "💖", "🌸", "🌻"][
            Math.floor(Math.random() * 4)
        ];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize =
            (20 + Math.random() * 20) + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
    }
}

</script>

</body>
</html>
